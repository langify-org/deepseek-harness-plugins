name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the Version Packages branch and tags
      pull-requests: write # open the Version Packages pull request
      id-token: write # npm trusted publishing (OIDC) with provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          # No registry-url: it writes an auth line reading ${NODE_AUTH_TOKEN}, which
          # pnpm then uses instead of exchanging the job's OIDC token, and npm
          # answers the publish with 404. pnpm publishes to npmjs.org by default.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Opens or updates the Version Packages pull request; once it is merged,
      # publishes every package whose version is not on npm yet.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
