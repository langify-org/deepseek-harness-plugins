name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the Version Packages branch and tags
      pull-requests: write # open the Version Packages pull request
      id-token: write # npm trusted publishing (OIDC) with provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          # pnpm 11 publishes through OIDC only for a configured registry.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Opens or updates the Version Packages pull request; once it is merged,
      # publishes every package whose version is not on npm yet.
      - uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
