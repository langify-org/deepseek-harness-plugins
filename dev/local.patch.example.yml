# dev/local.patch.yml (git-ignored) is your own layer for `just dev`, loaded
# after the plugin's dev config (dev/<plugin>.patch.yml).
#
# Usually you do not write it: `just dev-use-profile` makes it a link to your
# own profile's patch ($DSH_HOME/profiles/web/cordis.patch.yml), read only, so
# the dev UI reaches the same model provider as your DSH.
#
# To keep a separate setup instead, copy this file to dev/local.patch.yml and
# fill in the provider rows from your profile's patch:

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers: {}
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config: {}
