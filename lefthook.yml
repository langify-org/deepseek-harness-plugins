# Fast checks on staged files only. CI runs the full `pnpm check`.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,mts,js,mjs,json,md,yml,yaml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,mts,js,mjs}'
      run: pnpm exec oxlint --type-aware --deny-warnings {staged_files}
