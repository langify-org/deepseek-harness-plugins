packages:
  - packages/*

# DSH versions used for development, tests, and CI. Keep in step with each
# package's `engines.dsh` lower bound. DSH packages pin their peers exactly.
# React and zod follow the versions the DSH Web shell shares with plugins.
catalog:
  '@deepseek-ai/cordis': 4.1.0
  '@deepseek-ai/dsh': 0.2.2-rc.2
  '@deepseek-ai/dsh-agent': 0.2.2-rc.2
  '@deepseek-ai/dsh-api-session-controller': 0.2.2-rc.2
  '@deepseek-ai/dsh-api-terminal-controller': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-connection': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-locale': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-store': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-ui-primitives': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-ui-renderer': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-ui-sidebar-right': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-ui-sidebar-terminal': 0.2.2-rc.2
  '@deepseek-ai/dsh-client-ui-slots': 0.2.2-rc.2
  '@deepseek-ai/dsh-llm': 0.2.2-rc.2
  '@deepseek-ai/dsh-sandbox': 0.2.2-rc.2
  '@deepseek-ai/dsh-sandbox-policy': 0.2.2-rc.2
  '@deepseek-ai/dsh-session': 0.2.2-rc.2
  '@deepseek-ai/dsh-session-query': 0.2.2-rc.2
  '@deepseek-ai/dsh-session-title': 0.2.2-rc.2
  '@deepseek-ai/dsh-storage-domain': 0.2.2-rc.2
  '@deepseek-ai/dsh-subagent': 0.2.2-rc.2
  '@deepseek-ai/dsh-subprocess': 0.2.2-rc.2
  '@deepseek-ai/dsh-system-prompt': 0.2.2-rc.2
  '@deepseek-ai/dsh-tools': 0.2.2-rc.2
  '@deepseek-ai/dsh-user-approval': 0.2.2-rc.2
  '@deepseek-ai/dsh-working-directory': 0.2.2-rc.2
  '@deepseek-ai/dsh-workspace': 0.2.2-rc.2
  '@deepseek-ai/schemastery': 3.19.0
  '@types/react': 18.3.31
  '@types/ws': 8.18.2
  '@wterm/dom': 0.5.9
  ws: 8.22.1
  zod: 4.6.6

# Dependency install scripts. Only lefthook (installs the git hooks) runs;
# the DSH runtime's native extras are not needed by `--dump-config` or `pnpm dev`.
allowBuilds:
  lefthook: true
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@wterm/core@0.5.9'
  - '@wterm/dom@0.5.9'
