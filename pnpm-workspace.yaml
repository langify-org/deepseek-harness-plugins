packages:
  - packages/*

# DSH versions used for development, tests, and CI. Keep in step with each
# package's `engines.dsh` lower bound. DSH packages pin their peers exactly.
# React and zod follow the versions the DSH Web shell shares with plugins.
catalog:
  '@deepseek-ai/cordis': 4.0.5
  '@deepseek-ai/dsh': 0.2.1-rc.3
  '@deepseek-ai/dsh-api-session-controller': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-connection': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-locale': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-store': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-conversation': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-dockkit': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-renderer': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-sidebar-documentpreview': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-sidebar-right': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-slots': 0.2.1-rc.3
  '@deepseek-ai/dsh-fs': 0.2.1-rc.3
  '@deepseek-ai/dsh-host-webserver': 0.2.1-rc.3
  '@deepseek-ai/dsh-session': 0.2.1-rc.3
  '@deepseek-ai/dsh-session-persistence': 0.2.1-rc.3
  '@deepseek-ai/dsh-subprocess': 0.2.1-rc.3
  '@deepseek-ai/dsh-tools': 0.2.1-rc.3
  '@deepseek-ai/dsh-util-workspace-path': 0.2.1-rc.3
  '@deepseek-ai/dsh-working-directory': 0.2.1-rc.3
  '@deepseek-ai/schemastery': 3.18.5
  '@types/react': 18.3.31
  '@types/vscode': 1.140.0
  '@vscode/vsce': 4.1.0
  zod: 4.4.3

# Dependency install scripts. Only lefthook (installs the git hooks) runs;
# the DSH runtime's native extras are not needed by `--dump-config` or `pnpm dev`,
# and the VSIX is packaged without a signature.
allowBuilds:
  lefthook: true
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  '@vscode/vsce-sign': false
  koffi: false
  node-pty: false
  protobufjs: false
