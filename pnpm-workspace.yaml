packages:
  - plugins/*

# One place for every shared version. DSH packages are pinned to the runtime the
# plugins are developed and tested against; each plugin's peerDependencies state
# the range it supports. Bump them together (see AGENTS.md, "Upgrading DSH").
catalog:
  '@deepseek-ai/cordis': ~4.0.4
  '@deepseek-ai/schemastery': ~3.18.4
  '@deepseek-ai/dsh-agent': 0.2.0-rc.2
  '@deepseek-ai/dsh-llm': 0.2.0-rc.2
  '@deepseek-ai/dsh-session': 0.2.0-rc.2
  '@deepseek-ai/dsh-session-persistence': 0.2.0-rc.2
  '@deepseek-ai/dsh-storage-domain': 0.2.0-rc.2
  '@deepseek-ai/dsh-workspace': 0.2.0-rc.2
  '@changesets/cli': ^3.0.3
  '@types/node': ^24.19.1
  typescript: ~6.0.3
