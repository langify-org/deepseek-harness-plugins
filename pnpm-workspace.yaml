packages:
  - plugins/*
  - tooling/*

# Shared versions for the plugins that take them from the catalog (session-hooks).
# DSH packages are pinned to the runtime the plugins are developed and tested
# against; each plugin's peerDependencies state the range it supports. Bump them
# together (see AGENTS.md, "Upgrading DSH"). dsh-chrome and the tooling pin exact
# versions in their own package.json instead.
catalog:
  '@deepseek-ai/cordis': ~4.0.4
  '@deepseek-ai/schemastery': ~3.18.4
  '@deepseek-ai/dsh-agent': 0.2.0-rc.2
  '@deepseek-ai/dsh-llm': 0.2.0-rc.2
  '@deepseek-ai/dsh-session': 0.2.0-rc.2
  '@deepseek-ai/dsh-session-persistence': 0.2.0-rc.2
  '@deepseek-ai/dsh-storage-domain': 0.2.0-rc.2
  '@deepseek-ai/dsh-workspace': 0.2.0-rc.2
  '@changesets/cli': ^3.0.3
  esbuild-wasm: 0.28.2
  js-yaml: ^5.4.3
  '@types/node': ^24.19.1
  typescript: ~6.0.3

# esbuild resolves its platform binary from an optional dependency package. Its
# install script only verifies that binary, so it is not run.
allowBuilds:
  esbuild: false

# Dependencies patched as they are installed, each for a reason its patch states.
patchedDependencies:
  # noVNC awaits at the top level of a module, which a DSH client module cannot.
  '@novnc/novnc@1.7.0': patches/@novnc__novnc@1.7.0.patch
